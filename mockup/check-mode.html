<title>Maths Missions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, one question at a time, big tap targets. Lexend body for easy reading. */
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#15302b; --muted:#5b726c;
  --accent:#0f8a6f; --accent-ink:#ffffff; --hl:#ffe27a; --hl-ink:#3a2e00;
  --line:#d3e0dc; --good:#1b8a4a; --slip:#c77700; --bad:#c23b3b; --soft:#e3efeb;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Lexend",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --card:#16241f; --ink:#e4efeb; --muted:#9db3ac;
  --accent:#3cc59f; --accent-ink:#06231b; --hl:#7a6510; --hl-ink:#fff6cf;
  --line:#2a3d37; --good:#4fd08a; --slip:#f0a63a; --bad:#ff7b7b; --soft:#1d302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --card:#16241f; --ink:#e4efeb; --muted:#9db3ac;
  --accent:#3cc59f; --accent-ink:#06231b; --hl:#7a6510; --hl-ink:#fff6cf;
  --line:#2a3d37; --good:#4fd08a; --slip:#f0a63a; --bad:#ff7b7b; --soft:#1d302a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:20px}
.step{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.q p{margin:0 0 10px}
.w{background:none;border:none;font:inherit;color:inherit;padding:1px 2px;margin:0 -1px;cursor:pointer;border-radius:4px}
.w:hover{background:var(--soft)}
.w.found{background:var(--hl);color:var(--hl-ink);font-weight:600}
.w.miss{opacity:.45;text-decoration:line-through}
.w.missed{outline:2px dashed var(--slip);outline-offset:1px;font-weight:600}
.w:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.diagram{position:relative;max-width:320px;width:100%;aspect-ratio:320/240;margin:0 auto}
.diagram svg{position:absolute;inset:0;width:100%;height:100%}
.diagram .w{position:absolute;transform:translate(-50%,-50%);font-size:.95rem;white-space:nowrap}
.pop{font-size:.85rem;color:var(--muted);min-height:1.4em;text-align:center}
.finder{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:.95rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.finder b{font-variant-numeric:tabular-nums}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ans input{font:inherit;font-size:1.3rem;width:140px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ans .unit{font-size:1.2rem;font-weight:600}
.btn{font:inherit;font-weight:600;font-size:1.05rem;padding:14px 20px;border-radius:12px;border:none;cursor:pointer;
     background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.checks label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.fb{border-radius:12px;padding:16px;border:2px solid}
.fb h3{margin:0 0 6px;font-family:var(--display);font-size:1.2rem}
.fb p{margin:0}
.fb.good{border-color:var(--good)} .fb.good h3{color:var(--good)}
.fb.slip{border-color:var(--slip)} .fb.slip h3{color:var(--slip)}
.fb.bad{border-color:var(--bad)} .fb.bad h3{color:var(--bad)}
.tally{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}
.pill{padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.pill.g{border-color:var(--good);color:var(--good)} .pill.s{border-color:var(--slip);color:var(--slip)} .pill.b{border-color:var(--bad);color:var(--bad)}
.note{font-size:.85rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{transform:translateY(6px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <h1>Maths Missions</h1>
    <div class="dots" id="dots"></div>
  </header>

  <div class="tally">
    <span class="pill g">Right <b id="tg">0</b></span>
    <span class="pill s">Slips <b id="ts">0</b></span>
    <span class="pill b">Learn it <b id="tb">0</b></span>
    <span class="pill">⭐ Points <b id="tp">0</b></span>
  </div>

  <div class="card" id="card"></div>

  <p class="note">Mock-up · example questions from your assessment</p>
</div>

<script>
/* [[word]] = key detail. Words are all tappable; key ones are not marked until found. */
const Q = [
  { diagram:true,
    labels:[{t:"60°",x:47,y:28,key:true},{t:"60°",x:27,y:72,key:true},{t:"36 mm",x:46,y:96,key:true},{t:"Not drawn to scale",x:82,y:12,key:false}],
    text:["Calculate the [[perimeter]] of this triangle.","Give your answer in [[centimetres.]]"],
    unit:"cm", answer:10.8,
    slips:{108:"You got 108 mm. Great maths! But it asked for cm. 108 ÷ 10 = 10.8 cm."},
    hint:"Two 60° angles means the third is 60° too, so all sides are 36 mm. 36 × 3 = 108 mm, then ÷ 10 for cm.",
    checks:["I found the unit it wants","I changed units if I needed to","My answer makes sense for the size"]
  },
  { text:["Here is a formula:","[[a = 4b²]]","Work out the value of a when [[b = 3]]"],
    unit:"", answer:36,
    slips:{144:"You did 4 × 3 first, then squared. Square first! 3² = 9, then 4 × 9 = 36.",
           46:"Close! 3² = 9 (not 3 × 2). Then 4 × 9 = 36."},
    hint:"Powers first: 3² = 3 × 3 = 9. Then 4 × 9.",
    checks:["I did the power (²) first","3² means 3 × 3, not 3 × 2","I checked my times table"]
  },
  { text:["It takes [[9]] builders [[60]] days to build a house.","How long would it take for [[6]] builders to complete the same house?"],
    unit:"days", answer:90,
    slips:{40:"Fewer builders can't be faster! 9 × 60 = 540 days of work. 540 ÷ 6 = 90."},
    hint:"Total work = 9 × 60 = 540. Share between 6: 540 ÷ 6.",
    checks:["Fewer workers means MORE days","I found the total work first","My answer went UP"]
  }
];

let i=0, phase="read", tally={g:0,s:0,b:0}, points=0, taps={}, popMsg="";
const card=document.getElementById("card");
const $=id=>document.getElementById(id);

function tokens(q){
  const out=[];
  q.text.forEach((line,li)=>{
    line.split(/(\[\[.*?\]\]|\s+)/).filter(Boolean).forEach(tok=>{
      if(/^\s+$/.test(tok)) out.push({space:true,line:li});
      else if(tok.startsWith("[[")) out.push({t:tok.slice(2,-2),key:true,line:li});
      else out.push({t:tok,key:false,line:li});
    });
  });
  return out;
}
function allTokens(q){
  const t=tokens(q).filter(x=>!x.space);
  return (q.labels||[]).map(l=>({...l,label:true})).concat(t);
}
function keyTotal(q){return allTokens(q).filter(x=>x.key).length}
function foundCount(q){return allTokens(q).filter((x,n)=>x.key&&taps[n]==="found").length}

function wordBtn(tok,n,style=""){
  let cls="w";
  if(taps[n]==="found")cls+=" found";
  else if(taps[n]==="miss")cls+=" miss";
  else if(phase!=="read"&&tok.key)cls+=" missed";
  return `<button class="${cls}" data-n="${n}" ${style}>${tok.t}</button>`;
}

function render(){
  const q=Q[i];
  $("dots").innerHTML=Q.map((_,n)=>`<span class="dot ${n<=i?'on':''}"></span>`).join("");
  const all=allTokens(q);
  let n=0, html="";
  if(q.diagram){
    html+=`<div class="diagram"><svg viewBox="0 0 320 240" aria-hidden="true">
      <polygon points="150,30 40,190 260,190" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M135,52 A26,26 0 0 0 165,52" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M58,163 A30,30 0 0 1 72,190" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <line x1="40" y1="215" x2="260" y2="215" stroke="currentColor" stroke-width="1.5"/>
      <polygon points="40,215 48,211 48,219" fill="currentColor"/><polygon points="260,215 252,211 252,219" fill="currentColor"/>
    </svg>`;
    q.labels.forEach(l=>{html+=wordBtn(all[n],n,`style="left:${l.x}%;top:${l.y}%"`);n++});
    html+=`</div>`;
  }
  const toks=tokens(q); let lines=[];
  toks.forEach(tok=>{
    lines[tok.line]=lines[tok.line]||"";
    if(tok.space)lines[tok.line]+=" ";
    else {lines[tok.line]+=wordBtn(all[n],n);n++}
  });
  html+=lines.map(l=>`<p>${l}</p>`).join("");

  const total=keyTotal(q), found=foundCount(q);
  let body=`<div class="step">Question ${i+1} of ${Q.length}</div><div class="q">${html}</div>`;

  if(phase==="read"){
    body+=`<div class="finder"><span>🔍 Tap the key details for bonus points</span><b>${found} found</b></div>
      <div class="pop" id="pop">${popMsg}</div>
      <button class="btn" id="go">I'm ready to answer</button>`;
  } else {
    const missed=total-found;
    const bonusLine = missed===0 ? `🌟 You found all ${total} details!` : `You found ${found} of ${total}. The <span style="outline:2px dashed var(--slip);padding:0 4px;border-radius:4px">dashed</span> ones were missed.`;
    body+=`<div class="finder"><span>${bonusLine}</span></div>`;
    if(phase==="answer"){
      body+=`<div class="ans"><input id="a" inputmode="decimal" aria-label="Your answer"><span class="unit">${q.unit}</span></div>
        <button class="btn" id="check">Check ✋</button>`;
    } else if(phase==="check"){
      body+=`<div class="ans"><input id="a" value="${window._a||''}" disabled aria-label="Your answer"><span class="unit">${q.unit}</span></div>
        <div class="step">Tick each one before you submit</div>
        <div class="checks">${q.checks.map((c,k)=>`<label><input type="checkbox" id="c${i}_${k}" class="cb"><span>${c}</span></label>`).join("")}</div>
        <button class="btn" id="submit" disabled>Submit</button>
        <button class="btn ghost" id="back">Go back and change it</button>`;
    } else {
      body+=window._fb+`<button class="btn" id="next">${i<Q.length-1?'Next mission →':'Start again'}</button>`;
    }
  }
  card.innerHTML=body;
  wire();
}

function setTally(){["g","s","b"].forEach(t=>$("t"+t).textContent=tally[t]);$("tp").textContent=points}

function wire(){
  const q=Q[i], all=allTokens(q);
  card.querySelectorAll(".w").forEach(b=>b.onclick=()=>{
    if(phase!=="read")return;
    const n=+b.dataset.n; if(taps[n])return;
    if(all[n].key){taps[n]="found";points+=1;popMsg="+1 ⭐ good spot";}
    else{taps[n]="miss";points=Math.max(0,points-1);popMsg="Not a key detail (−1)";}
    setTally();render();
  });
  if($("go")) $("go").onclick=()=>{
    if(foundCount(q)===keyTotal(q)){points+=3;}
    setTally();phase="answer";popMsg="";render();$("a")?.focus();
  };
  if($("check")) $("check").onclick=()=>{const v=$("a").value.trim(); if(!v){$("a").focus();return} window._a=v; phase="check"; render()};
  if($("back")) $("back").onclick=()=>{phase="answer";render();const a=$("a");a.value=window._a;a.focus()};
  card.querySelectorAll(".cb").forEach(c=>c.onchange=()=>{
    $("submit").disabled=![...card.querySelectorAll(".cb")].every(x=>x.checked);
  });
  if($("submit")) $("submit").onclick=()=>{
    const v=parseFloat(window._a);
    let cls,title,msg;
    if(Math.abs(v-q.answer)<1e-9){cls="good";title="Nailed it ✅ +5";msg="Checking paid off.";tally.g++;points+=5}
    else if(q.slips[v]){cls="slip";title="Slip, not a mistake 🟠";msg=q.slips[v];tally.s++}
    else{cls="bad";title="Let's learn this one 🔴";msg=q.hint+` Answer: ${q.answer} ${q.unit}.`;tally.b++}
    window._fb=`<div class="fb ${cls}"><h3>${title}</h3><p>${msg}</p></div>`;
    setTally(); phase="done"; render();
  };
  if($("next")) $("next").onclick=()=>{
    i=(i+1)%Q.length;
    if(i===0){tally={g:0,s:0,b:0};points=0}
    setTally(); taps={}; phase="read"; window._a=""; render();
  };
}
render();
</script>
