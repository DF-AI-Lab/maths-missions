<title>Maths Missions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, one question at a time, big tap targets. Lexend body for easy reading. */
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#15302b; --muted:#5b726c;
  --accent:#0f8a6f; --accent-ink:#ffffff; --hl:#ffe27a; --hl-ink:#3a2e00;
  --line:#d3e0dc; --good:#1b8a4a; --slip:#c77700; --bad:#c23b3b; --soft:#e3efeb;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Lexend",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --card:#16241f; --ink:#e4efeb; --muted:#9db3ac;
  --accent:#3cc59f; --accent-ink:#06231b; --hl:#7a6510; --hl-ink:#fff6cf;
  --line:#2a3d37; --good:#4fd08a; --slip:#f0a63a; --bad:#ff7b7b; --soft:#1d302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --card:#16241f; --ink:#e4efeb; --muted:#9db3ac;
  --accent:#3cc59f; --accent-ink:#06231b; --hl:#7a6510; --hl-ink:#fff6cf;
  --line:#2a3d37; --good:#4fd08a; --slip:#f0a63a; --bad:#ff7b7b; --soft:#1d302a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:.95rem;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--soft)}
.tally{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.pill{padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.pill.g{border-color:var(--good);color:var(--good)} .pill.s{border-color:var(--slip);color:var(--slip)} .pill.b{border-color:var(--bad);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.step{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.q p{margin:0 0 10px}
.w{background:none;border:none;font:inherit;color:inherit;padding:1px 2px;margin:0 -1px;cursor:pointer;border-radius:4px}
.w:hover{background:var(--soft)}
.w.found{background:var(--hl);color:var(--hl-ink);font-weight:600}
.w.miss{opacity:.45;text-decoration:line-through}
.w.missed{outline:2px dashed var(--slip);outline-offset:1px;font-weight:600}
.info{font:inherit;font-size:.72rem;font-weight:700;width:20px;height:20px;border-radius:50%;border:none;background:var(--slip);color:var(--card);cursor:pointer;margin-left:3px;vertical-align:middle;line-height:20px;padding:0}
.diagram{position:relative;max-width:300px;width:100%;aspect-ratio:320/240;margin:0 auto 8px}
.diagram svg{position:absolute;inset:0;width:100%;height:100%;color:var(--ink)}
.diagram .lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:.95rem}
.why{background:var(--soft);border-left:4px solid var(--slip);border-radius:8px;padding:10px 14px;font-size:.92rem}
.why b{display:block}
.finder{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:.95rem;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pop{font-size:.85rem;color:var(--muted);min-height:1.4em;text-align:center}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ans input{font:inherit;font-size:1.25rem;width:130px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ans input.u{width:100px;font-size:1.05rem}
.ans .unit{font-size:1.2rem;font-weight:600}
.btn{font:inherit;font-weight:600;font-size:1.05rem;padding:14px 20px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.checks label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.fb{border-radius:12px;padding:16px;border:2px solid}
.fb h3{margin:0 0 6px;font-family:var(--display);font-size:1.2rem}
.fb p{margin:0}
.fb.good{border-color:var(--good)} .fb.good h3{color:var(--good)}
.fb.slip{border-color:var(--slip)} .fb.slip h3{color:var(--slip)}
.fb.bad{border-color:var(--bad)} .fb.bad h3{color:var(--bad)}
.err{color:var(--bad);font-size:.9rem;margin:0}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{transform:translateY(6px);opacity:.6}}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;flex-wrap:wrap}
.row .val{font-weight:600;font-variant-numeric:tabular-nums}
.row .lbl{color:var(--muted);font-size:.9rem}
.mini{font:inherit;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.hintbox{background:var(--soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.92rem}
.big{font-family:var(--display);font-size:3rem;font-weight:800;margin:0;line-height:1;font-variant-numeric:tabular-nums}
.boss{border-color:var(--slip)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--slip);color:var(--card);letter-spacing:.05em;text-transform:uppercase}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}
.pound{font-size:1.25rem;font-weight:600}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px}
.wrow .ans{flex-wrap:nowrap}
.wrow .lbl{color:var(--muted);font-size:.85rem}
.wrow .val{font-weight:600;font-variant-numeric:tabular-nums}
.wrow input.u{width:96px}
.wrow .mini{grid-column:1 / -1;justify-self:start}
</style>

<div class="wrap">
  <header>
    <h1>Garden Makeover</h1>
    <div class="dots" id="dots"></div>
  </header>
  <div class="bar">
    <div class="tabs" id="levels">
      <button class="chip on" data-lv="1">Level 1</button>
      <button class="chip" data-lv="2">Level 2</button>
      <button class="chip" data-lv="3">Level 3</button>
    </div>
    <div class="tally">
      <span class="pill">🎯 Score <b id="sc">100</b></span>
      <span class="pill s">Hints <b id="hu">0</b></span>
      <span class="pill b">Boss tries <b id="bt">0</b></span>
    </div>
  </div>
  <div class="card" id="card"></div>
  <p class="note" id="lvnote"></p>
</div>

<script>
/* [[word|why]] marks a key detail. Nothing marks it until found. */
const ITEMS = [
  { title:"The fence",
    rect:{labels:[{t:"12 m",x:50,y:7,why:"Long side. It's a rectangle, so the opposite side is 12 m too."},
                  {t:"800 cm",x:91,y:50,why:"This side is in cm, not m! 800 cm = 8 m."},
                  {t:"Garden",x:50,y:50}]},
    text:["A fence goes [[all the way round|All the way round = perimeter. Add all 4 sides.]] the garden.",
          "Work out how much fence is needed.",
          "Give your answer in [[metres.|Answer in m. One side is in cm, so convert it first (÷ 100).]]"],
    unit:"m", units:["cm","m","km"], answer:40,
    hint:"Change 800 cm into metres first. Then add all four sides.",
    checks:["I changed cm into m first","I added all 4 sides","My answer is in metres"] },
  { title:"The patio",
    text:["A patio needs [[45|How many slabs you need.]] slabs.",
          "Slabs are sold in [[packs of 8.|8 slabs in each pack, so divide.]]",
          "How many packs do you need to [[buy?|You can't buy part of a pack, so round UP.]]"],
    fixed:"packs", answer:6,
    hint:"45 ÷ 8 = 5.6… You can't buy 0.6 of a pack.",
    checks:["I divided slabs by the pack size","I rounded UP (no half packs)"] },
  { title:"The gardeners",
    text:["It takes [[2|Starting number of gardeners.]] gardeners [[6|Days the 2 gardeners take.]] days to do the garden.",
          "How many days would it take [[3|More gardeners, so FEWER days.]] gardeners?"],
    unit:"days", units:["hours","days","weeks"], answer:4,
    hint:"Total work = 2 × 6 days of work. Share it between 3.",
    checks:["More workers means FEWER days","I found the total work first"] },
  { title:"The lawn",
    rect:{labels:[{t:"6 m",x:50,y:7,why:"Length of the lawn."},{t:"5 m",x:91,y:50,why:"Width of the lawn."},{t:"Lawn",x:50,y:50}]},
    text:["New turf will cover the [[whole lawn.|Covering a surface = AREA, not perimeter.]]",
          "Work out the [[area|Area = length × width.]] of the lawn."],
    unit:"m²", units:["m","m²","cm²"], answer:30,
    hint:"Area = length × width. Units are squared.",
    checks:["I found the area, not the perimeter","My unit is squared (m²)"] },
  { title:"Boss: the budget", boss:true,
    text:["Fence costs [[£9 per metre.|Times by your fence answer (Mission 1).]]",
          "Slabs cost [[£24 a pack.|Times by your packs answer (Mission 2).]]",
          "Gardeners cost [[£120 a day.|Times by your days answer (Mission 3).]]",
          "Turf costs [[£4 per m².|Times by your area answer (Mission 4).]]",
          "Your budget is [[£1,200.|Take the total cost away from this.]]",
          "Using your mission answers, how much money is [[left?|Left = budget minus everything you spend.]]"],
    answer:96,
    hint:"Work out 4 costs: fence, slabs, gardeners, turf. Add them up. Then take that from £1,200." }
];
const NM = ITEMS.length-1;
const LVNOTE={1:"Level 1: the unit is shown next to the box.",2:"Level 2: you pick the unit.",3:"Level 3: you type the unit yourself."};

let lv=1, score=100, hints=0, bossTries=0, view=0, detective=false, recheck=null, bossMsg="", err="", popMsg="", open=null;
const S = ITEMS.map(()=>({taps:{},phase:"read",num:"",unit:"",picked:"",first:null,hint:false,bonus:false}));
const card=document.getElementById("card"), $=id=>document.getElementById(id);

const lines=it=>it.text.map(line=>line.split(/(\[\[.*?\]\]|\s+)/).filter(Boolean).map(tok=>{
  if(/^\s+$/.test(tok))return{space:true};
  if(tok.startsWith("[[")){const[t,why]=tok.slice(2,-2).split("|");return{t,why,key:true}}
  return{t:tok};
}));
const all=it=>((it.rect&&it.rect.labels)||[]).map(l=>({...l,key:!!l.why})).concat(lines(it).flat().filter(x=>!x.space));
const keyTotal=it=>all(it).filter(x=>x.key).length;
const found=k=>all(ITEMS[k]).filter((x,n)=>x.key&&S[k].taps[n]==="found").length;
const num=s=>parseFloat(String(s).replace(/[£,\s]/g,""));
const unitOf=it=>it.fixed||it.unit||"";
function normUnit(s){
  s=(s||"").trim().toLowerCase();
  const map=[["m²",/^(m2|m²|sq ?m|square met(re|er)s?)$/],["cm²",/^(cm2|cm²|sq ?cm)$/],["cm",/^(cm|cms|centimet(re|er)s?)$/],["km",/^(km|kilomet(re|er)s?)$/],["m",/^(m|met(re|er)s?)$/],["days",/^(days?|d)$/],["hours",/^(hours?|hrs?|h)$/],["weeks",/^(weeks?|wks?)$/]];
  for(const[k,r]of map)if(r.test(s))return k; return s;
}
const isRight=k=>{const it=ITEMS[k],st=S[k];return Math.abs(num(st.num)-it.answer)<1e-9&&(!it.unit||st.unit===it.unit)};
const setTally=()=>{$("sc").textContent=score;$("hu").textContent=hints;$("bt").textContent=bossTries};
const addScore=d=>{score=Math.max(0,score+d);setTally()};

function word(k,tok,n,style=""){
  const st=S[k]; let cls="w",extra="";
  if(st.taps[n]==="found")cls+=" found";
  else if(st.taps[n]==="miss")cls+=" miss";
  else if(st.phase!=="read"&&tok.key){cls+=" missed";extra=`<button class="info" data-why="${n}" aria-label="Why this matters">i</button>`}
  const b=`<button class="${cls}" data-n="${n}">${tok.t}</button>${extra}`;
  return style?`<span class="lab" ${style}>${b}</span>`:b;
}
function questionHtml(k){
  const it=ITEMS[k],toks=all(it); let n=0,h="";
  if(it.rect){
    h+=`<div class="diagram" style="aspect-ratio:320/200"><svg viewBox="0 0 320 200" aria-hidden="true"><rect x="50" y="30" width="220" height="140" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
    it.rect.labels.forEach(l=>{h+=word(k,toks[n],n,`style="left:${l.x}%;top:${l.y}%"`);n++});
    h+=`</div>`;
  }
  h+=lines(it).map(line=>"<p>"+line.map(t=>t.space?" ":word(k,toks[n],n++)).join("")+"</p>").join("");
  if(open!==null&&toks[open]&&toks[open].why&&S[k].phase!=="read")h+=`<div class="why"><b>Why "${toks[open].t}" matters</b>${toks[open].why}</div>`;
  return h;
}
function unitInput(k,disabled){
  const it=ITEMS[k],st=S[k];
  if(it.boss)return"";
  if(it.fixed)return`<span class="unit">${it.fixed}</span>`;
  if(lv===1)return`<span class="unit">${it.unit}</span>`;
  if(lv===2)return it.units.map(u=>disabled?`<span class="chip">${u}</span>`:`<button class="chip ${st.picked===u?'on':''}" data-u="${u}">${u}</button>`).join("");
  return`<input class="u" id="u" placeholder="unit" aria-label="Unit" value="${st.unit&&!disabled?st.unit:""}" ${disabled?"disabled":""}>`;
}
const PRICES=[{l:"Fence",p:"£9 per m"},{l:"Slabs",p:"£24 a pack"},{l:"Gardeners",p:"£120 a day"},{l:"Turf",p:"£4 per m²"}];
const W={c:["","","",""],total:""};
function workPanel(){
  const rows=ITEMS.slice(0,NM).map((it,k)=>`
    <div class="wrow">
      <span><span class="lbl">Mission ${k+1} · ${PRICES[k].l}</span><br>
      <span class="val">${S[k].num||"—"} ${S[k].num?(it.fixed||S[k].unit):""}</span> <span class="lbl">× ${PRICES[k].p}</span></span>
      <span class="ans" style="gap:6px"><span class="pound">£</span><input class="u" id="w${k}" inputmode="decimal" aria-label="${PRICES[k].l} cost" value="${W.c[k]}"></span>
      ${detective?`<button class="mini" data-recheck="${k}">Recheck mission</button>`:""}
    </div>`).join("");
  return `<div class="step">Working out</div><div class="list">${rows}
    <div class="wrow"><span class="lbl">Total spent</span><span class="ans" style="gap:6px"><span class="pound">£</span><input class="u" id="wt" inputmode="decimal" aria-label="Total spent" value="${W.total}"></span></div>
    <div class="wrow"><span class="lbl">£1,200 − total<br><b>= money left</b></span><span class="ans" style="gap:6px"><span class="pound">£</span><input class="u" id="a" inputmode="decimal" aria-label="Money left" value="${S[NM].num}"></span></div>
  </div>`;
}

function render(){
  $("dots").innerHTML=ITEMS.map((_,n)=>`<span class="dot ${n<=Math.min(view,NM)?'on':''}"></span>`).join("");
  $("lvnote").textContent=LVNOTE[lv];
  if(view==="done")return renderDone();
  const k=recheck!==null?recheck:view, it=ITEMS[k], st=S[k], total=keyTotal(it), f=found(k);
  let b=it.boss?`<span class="tag">Boss question</span>`:`<div class="step">${recheck!==null?"Rechecking ":""}Mission ${k+1} of ${NM} · ${it.title}</div>`;
  b+=`<div class="q">${questionHtml(k)}</div>`;

  const open1=st.phase==="read";
  b+=`<div class="finder"><span>${open1?"🔍 Tap any word or number you think matters (optional)":f===total?`🌟 All ${total} key details found`:`Found ${f} of ${total}. Tap <b>i</b> on the dashed ones to see why they matter.`}</span>${open1?`<b>${f} found</b>`:""}</div>`;
  if(open1&&popMsg)b+=`<div class="pop">${popMsg}</div>`;
  if(st.hint)b+=`<div class="hintbox"><b>Hint:</b> ${it.hint}</div>`;
  const hintBtn=st.hint?"":`<button class="btn ghost" id="hint">💡 Hint (−5)</button>`;

  if(it.boss){
    b+=workPanel();
    b+=`${bossMsg}<button class="btn" id="boss">Submit to the boss 👹</button>${hintBtn}`;
    return paint(b);
  }
  b+=`<div class="ans"><input id="a" inputmode="decimal" placeholder="Answer" aria-label="Your answer" value="${st.num}">${unitInput(k,false)}</div>
      ${err?`<p class="err">${err}</p>`:""}`;
  if(st.showChecks) b+=`<div class="checks">${it.checks.map((c,j)=>`<label><input type="checkbox" id="c${k}_${j}"><span>${c}</span></label>`).join("")}</div>`;
  b+=`<button class="btn" id="save">${recheck!==null?"Save and back to the boss":"Save answer"}</button>
      <button class="btn ghost" id="checks">${st.showChecks?"Hide checklist":"✋ Quick check (optional)"}</button>${hintBtn}`;
  paint(b);
}
function paint(b){card.innerHTML=b;card.classList.toggle("boss",view===NM);wire()}

function renderDone(){
  const rows=ITEMS.slice(0,NM).map((it,k)=>`<div class="row"><span class="lbl">Mission ${k+1} · ${it.title}</span>
    <span>first try ${S[k].first&&S[k].first.ok?'<span class="ok">✓</span>':'<span class="no">✗</span>'}</span></div>`).join("");
  paint(`<span class="tag">Mission complete</span><div><p class="big">${score}</p><p class="lbl" style="margin:4px 0 0">final score</p></div>
    <div class="list"><div class="row"><span class="lbl">Boss tries</span><span class="val">${bossTries}</span></div>
    <div class="row"><span class="lbl">Hints used</span><span class="val">${hints}</span></div></div>
    <div class="step">How your first answers did</div><div class="list">${rows}</div>
    <button class="btn" id="again">Play again</button>`);
}

function wire(){
  const k=recheck!==null?recheck:view; if(view==="done"){ $("again").onclick=()=>location.reload(); return; }
  const it=ITEMS[k],st=S[k],toks=all(it);
  const keep=()=>{if($("a"))st.num=$("a").value;if($("u"))st.unit=$("u").value;for(let j=0;j<4;j++)if($("w"+j))W.c[j]=$("w"+j).value;if($("wt"))W.total=$("wt").value};
  card.querySelectorAll(".w").forEach(el=>el.onclick=()=>{
    if(st.phase!=="read")return; const n=+el.dataset.n; if(st.taps[n])return; keep();
    if(toks[n].key){st.taps[n]="found";addScore(1);popMsg="+1 good spot"}else{st.taps[n]="miss";addScore(-1);popMsg="Not a key detail (−1)"}
    render();
  });
  card.querySelectorAll(".info").forEach(el=>el.onclick=()=>{keep();const n=+el.dataset.why;open=open===n?null:n;render()});
  card.querySelectorAll("[data-u]").forEach(el=>el.onclick=()=>{keep();st.picked=el.dataset.u;render()});
  card.querySelectorAll("[data-recheck]").forEach(el=>el.onclick=()=>{keep();recheck=+el.dataset.recheck;open=null;err="";render();window.scrollTo(0,0)});
  if($("hint"))$("hint").onclick=()=>{keep();st.hint=true;hints++;addScore(-5);render()};
  if($("checks"))$("checks").onclick=()=>{keep();st.showChecks=!st.showChecks;render()};
  if($("save"))$("save").onclick=()=>{
    keep(); st.num=st.num.trim();
    const u=it.fixed?"":lv===1?it.unit:lv===2?st.picked:normUnit(st.unit);
    if(isNaN(num(st.num))){err="Type a number first.";return render()}
    if(it.unit&&!u){err="Add a unit too.";return render()}
    st.unit=u; err=""; popMsg=""; open=null;
    if(st.phase==="read"){ if(found(k)===keyTotal(it)&&!st.bonus){st.bonus=true;addScore(3)} st.phase="saved"; }
    if(recheck!==null){recheck=null;return render()}
    st.first={ok:isRight(k)}; view++; render(); window.scrollTo(0,0);
  };
  if($("boss"))$("boss").onclick=()=>{
    keep(); st.num=st.num.trim();
    if(st.phase==="read"){ if(found(k)===keyTotal(it)&&!st.bonus){st.bonus=true;addScore(3)} st.phase="saved"; popMsg=""; }
    if(isNaN(num(st.num))){bossMsg=`<p class="err">Type an amount first.</p>`;return render()}
    bossTries++;
    if(Math.abs(num(st.num)-it.answer)<1e-9){view="done";return render()}
    addScore(-10);detective=true;
    bossMsg=`<div class="fb bad"><h3>❌ Something doesn't add up (−10)</h3><p>You're <b>£${Math.abs(num(st.num)-it.answer).toLocaleString()} ${num(st.num)>it.answer?"too high":"too low"}</b>. 🕵️ Which part could be out by that much? Check your working, or tap <b>Recheck mission</b>.</p></div>`;
    render();
  };
}
document.querySelectorAll("#levels .chip").forEach(b=>b.onclick=()=>{
  lv=+b.dataset.lv;document.querySelectorAll("#levels .chip").forEach(x=>x.classList.toggle("on",x===b));
  S.forEach(s=>{s.picked=""});render();
});
render();
</script>
